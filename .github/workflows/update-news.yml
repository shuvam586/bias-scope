name: update news

on:
  schedule:
    - cron: "0 */8 * * *"

  workflow_dispatch:
    inputs:
      job:
        description: "Select pipeline to run"
        required: true
        type: choice
        options:
          - all
          - article_pipeline
          - summary_generation
        default: all

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r ml/requirements.txt

      - name: Cache Hugging Face model
        if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'article_pipeline'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Run article pipeline
        if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'article_pipeline'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m backend.app.article_pipeline

      - name: Generate event summaries
        if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'summary_generation'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m backend.app.summary_generation
